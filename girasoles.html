<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050414">
<title>Para ti 🌻</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    background: #000;
    color: white;
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    overflow: hidden;
}

/* ---------- Pantallas ---------- */
.pantalla {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
}

/* ---------- Pantalla inicial ---------- */
#inicio {
    z-index: 10;
    background: radial-gradient(ellipse at 50% 60%, #1a1233 0%, #050414 70%);
    transition: opacity 1s ease;
    padding: 24px;
}

#inicio h1 {
    color: #ffd21f;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(38px, 9vw, 68px);
    line-height: 1.1;
    margin-bottom: 18px;
    text-shadow: 0 0 28px rgba(255, 210, 31, .55);
}

#inicio p {
    font-size: clamp(19px, 4.6vw, 26px);
    margin-bottom: 38px;
    color: #e9dfc8;
}

.boton {
    font-family: inherit;
    font-style: italic;
    font-weight: 600;
    padding: 14px 38px;
    border: 2px solid #ffd21f;
    border-radius: 50px;
    background: transparent;
    color: #ffd21f;
    font-size: clamp(19px, 4.6vw, 24px);
    cursor: pointer;
    transition: background .3s, color .3s, box-shadow .3s;
    animation: latido 2.6s ease-in-out infinite;
}

.boton:hover,
.boton:focus-visible {
    background: #ffd21f;
    color: #1b1000;
    box-shadow: 0 0 30px rgba(255, 210, 31, .8);
    outline: none;
}

@keyframes latido {
    0%, 100% { box-shadow: 0 0 0 rgba(255, 210, 31, 0); }
    50%      { box-shadow: 0 0 22px rgba(255, 210, 31, .45); }
}

/* ---------- Escena ---------- */
#escena {
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease;
    background:
        radial-gradient(120% 70% at 50% 100%, rgba(255, 150, 60, .30) 0%, rgba(150, 60, 100, .20) 38%, transparent 68%),
        linear-gradient(to bottom, #050414 0%, #120b33 45%, #2a1548 78%, #3d1c4a 100%);
}

#escena.activa {
    opacity: 1;
    pointer-events: all;
}

#estrellas {
    position: absolute;
    inset: 0 0 40% 0;
    z-index: 0;
    pointer-events: none;
}

.estrella {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: brillo 2s infinite alternate;
}

@keyframes brillo {
    from { opacity: .2; }
    to   { opacity: 1; }
}

/* Canvas con los girasoles */
#campo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

/* Oscurece la parte baja para que el texto final se lea bien */
.velo {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 32%;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(to top, rgba(2, 5, 3, .82), rgba(2, 5, 3, .5) 55%, transparent);
}

/* ---------- Textos ---------- */
.mensaje {
    position: absolute;
    top: 5%;
    width: 90%;
    z-index: 5;
    opacity: 0;
}

.mensaje h2 {
    color: #ffd84a;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(36px, 8vw, 64px);
    line-height: 1.1;
    text-shadow: 0 0 26px rgba(255, 200, 40, .55);
}

.mensaje p {
    margin-top: 14px;
    font-size: clamp(19px, 4.4vw, 26px);
    line-height: 1.45;
    color: #f4ead3;
    text-shadow: 0 2px 10px rgba(0, 0, 0, .7);
}

.final {
    position: absolute;
    bottom: 5%;
    width: 90%;
    text-align: center;
    z-index: 5;
    opacity: 0;
}

.final h3 {
    color: #ffd84a;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(23px, 5.6vw, 36px);
    line-height: 1.2;
    text-shadow: 0 0 18px rgba(255, 200, 40, .5), 0 2px 8px rgba(0, 0, 0, .8);
}

.final p {
    margin-top: 8px;
    font-size: clamp(18px, 4.2vw, 23px);
    color: #f4ead3;
    text-shadow: 0 2px 8px rgba(0, 0, 0, .9);
}

/* Los textos aparecen cuando empieza la escena (antes se animaban al cargar la página) */
#escena.activa .mensaje { animation: aparecer 2s .6s ease-out both; }
#escena.activa .final   { animation: aparecer 2s 5.6s ease-out both; }

@keyframes aparecer {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ---------- Pétalos cayendo ---------- */
.petalo-caida {
    position: fixed;
    top: -30px;
    background: linear-gradient(160deg, #ffe75f, #f2a500);
    border-radius: 60% 40% 60% 40% / 70% 60% 40% 30%;
    box-shadow: 0 0 6px rgba(255, 200, 40, .5);
    animation: caer linear forwards;
    z-index: 20;
    pointer-events: none;
}

@keyframes caer {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { transform: translate3d(var(--dx), 112vh, 0) rotate(var(--rot)); }
}
</style>
</head>

<body>

<!-- PANTALLA INICIAL -->
<div id="inicio" class="pantalla">

    <h1>🌻 Tengo algo para ti...</h1>

</div>


<!-- ESCENA -->
<div id="escena" class="pantalla">

    <div id="estrellas"></div>

        <!-- EDITA AQUÍ: cambia NOMBRE por el nombre de la persona -->

</div>


<script>
(function () {
'use strict';

/* =========================================================
   Girasoles dibujados en canvas
   - Cada girasol crece desde el suelo (tallo + hojas),
     forma un botón verde y se abre pétalo por pétalo.
   - Después se mecen suavemente con el viento.
   ========================================================= */

var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

var cv  = document.getElementById('campo');
var ctx = cv.getContext('2d');
var W = 0, H = 0, R = 0, GY = 0, T0 = 0, running = false;

/* ---------- utilidades ---------- */
function clamp(v, a, b) { a = a === undefined ? 0 : a; b = b === undefined ? 1 : b; return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeOutBack(x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

var FOG = [36, 20, 72];               // color de la "neblina" para las flores lejanas
function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(hex, f) {
    var c = hexRgb(hex);
    return 'rgb(' + Math.round(lerp(c[0], FOG[0], f)) + ',' + Math.round(lerp(c[1], FOG[1], f)) + ',' + Math.round(lerp(c[2], FOG[2], f)) + ')';
}

/* ---------- sprites (se dibujan una sola vez) ---------- */
function petalSprite(kind) {
    var c = document.createElement('canvas'); c.width = 160; c.height = 240;
    var g = c.getContext('2d'); g.translate(80, 232);
    var L = 200, Wd = 80;

    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(-Wd * .9, -L * .25, -Wd * .6, -L * .85, 0, -L);
    g.bezierCurveTo( Wd * .6, -L * .85,  Wd * .9, -L * .25, 0, 0);
    g.closePath();

    var gr = g.createLinearGradient(0, 0, 0, -L);
    var stops = kind === 'back'
        ? [[0, '#a85200'], [.45, '#e08a00'], [1, '#ffc21a']]
        : [[0, '#e37b00'], [.4, '#ffb300'], [.8, '#ffd426'], [1, '#fff26a']];
    stops.forEach(function (s) { gr.addColorStop(s[0], s[1]); });
    g.fillStyle = gr; g.fill();

    g.save(); g.clip();
    // nervaduras
    g.strokeStyle = 'rgba(150,70,0,.30)'; g.lineWidth = 1.8;
    [-.3, -.12, 0, .12, .3].forEach(function (o) {
        g.beginPath(); g.moveTo(0, -L * .02);
        g.quadraticCurveTo(o * Wd * 1.4, -L * .5, o * Wd * .5, -L * .93);
        g.stroke();
    });
    // volumen: bordes más oscuros, centro más claro
    var hl = g.createLinearGradient(-Wd * .5, 0, Wd * .5, 0);
    hl.addColorStop(0, 'rgba(120,50,0,.24)');
    hl.addColorStop(.5, 'rgba(255,255,255,.10)');
    hl.addColorStop(1, 'rgba(120,50,0,.24)');
    g.fillStyle = hl; g.fillRect(-Wd, -L, Wd * 2, L);
    g.restore();
    return c;
}

var RAMP = [[0, '#241005'], [.45, '#3f1e09'], [.75, '#6b3a0d'], [.92, '#a26a17'], [1, '#c9922a']];
function rampColor(k) {
    for (var i = 1; i < RAMP.length; i++) {
        if (k <= RAMP[i][0]) {
            var a = RAMP[i - 1], b = RAMP[i], t = (k - a[0]) / (b[0] - a[0]);
            var ca = hexRgb(a[1]), cb = hexRgb(b[1]);
            return 'rgb(' + Math.round(lerp(ca[0], cb[0], t)) + ',' + Math.round(lerp(ca[1], cb[1], t)) + ',' + Math.round(lerp(ca[2], cb[2], t)) + ')';
        }
    }
    return RAMP[RAMP.length - 1][1];
}

/* Centro del girasol: semillas en espiral (ángulo de oro) */
function discSprite() {
    var S = 512, c = document.createElement('canvas'); c.width = c.height = S;
    var g = c.getContext('2d'); g.translate(S / 2, S / 2);
    var Rd = 240;

    var gr = g.createRadialGradient(0, 0, 0, 0, 0, Rd);
    gr.addColorStop(0, '#1c0c03'); gr.addColorStop(.6, '#2e1508');
    gr.addColorStop(.9, '#4d260a'); gr.addColorStop(1, '#7a4410');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, Rd, 0, 7); g.fill();

    var N = 1100, GA = Math.PI * (3 - Math.sqrt(5));
    for (var i = 1; i <= N; i++) {
        var k = Math.sqrt(i / N), rr = Rd * .965 * k, a = i * GA;
        var x = Math.cos(a) * rr, y = Math.sin(a) * rr;
        var sz = 5 + k * 3.6;

        g.fillStyle = 'rgba(0,0,0,.35)';
        g.beginPath(); g.arc(x + 1, y + 1.5, sz, 0, 7); g.fill();

        g.fillStyle = rampColor(k);
        g.beginPath(); g.ellipse(x, y, sz * .95, sz * .8, a, 0, 7); g.fill();

        g.fillStyle = 'rgba(255,205,120,' + (.06 + k * .28) + ')';
        g.beginPath(); g.arc(x - sz * .25, y - sz * .3, sz * .38, 0, 7); g.fill();
    }
    g.strokeStyle = 'rgba(40,16,2,.75)'; g.lineWidth = 7;
    g.beginPath(); g.arc(0, 0, Rd - 2, 0, 7); g.stroke();
    return c;
}

function tint(src, f) {
    if (!f) return src;
    var c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
    var g = c.getContext('2d');
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(' + FOG[0] + ',' + FOG[1] + ',' + FOG[2] + ',' + f + ')';
    g.fillRect(0, 0, c.width, c.height);
    return c;
}

var base = null, cache = {};
function spritesFor(fog) {
    if (!base) base = { pb: petalSprite('back'), pf: petalSprite('front'), disc: discSprite() };
    var key = fog.toFixed(2);
    if (!cache[key]) cache[key] = { pb: tint(base.pb, fog), pf: tint(base.pf, fog), disc: tint(base.disc, fog) };
    return cache[key];
}

/* ---------- formas ---------- */
function leafPath(g, L, Wd) {
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(L * .18, -Wd * 1.15, L * .70, -Wd * .95, L, 0);
    g.bezierCurveTo(L * .70,  Wd * .80,  L * .18,  Wd * .95, 0, 0);
    g.closePath();
}

function drawPetal(spr, len, wf) {
    var k = len / 200;
    ctx.drawImage(spr, -80 * k * wf, -232 * k, 160 * k * wf, 240 * k);
}

/* ---------- terreno ---------- */
function gy(x) {
    return GY + Math.sin(x / W * Math.PI * 2.2 + 1) * H * .006 + Math.sin(x / W * Math.PI * 5) * H * .003;
}

var blades = [];
function buildGrass() {
    blades = [];
    var n = Math.floor(W / 5);
    var cols = ['#0d2b16', '#134022', '#1b5a2c', '#0a2012'];
    for (var i = 0; i < n; i++) {
        blades.push({
            x: (i / n) * W + (Math.random() - .5) * 8,
            h: H * (.018 + Math.random() * .055),
            w: 2.5 + Math.random() * 3.5,
            ph: Math.random() * 6.28,
            c: cols[Math.floor(Math.random() * cols.length)],
            lean: (Math.random() - .5) * 10
        });
    }
}

/* ---------- los girasoles ---------- */
/* x, y de la cabeza (fracción de pantalla), r (tamaño), niebla, capa, retraso (s), duración (s) */
var SPECS = [
    [ .06, .64, .50, .46, 0, 1.10, 4.2],
    [ .24, .61, .55, .44, 0, 0.90, 4.2],
    [ .42, .64, .48, .46, 0, 1.35, 4.0],
    [ .60, .62, .52, .44, 0, 1.00, 4.2],
    [ .78, .60, .55, .44, 0, 0.80, 4.2],
    [ .95, .64, .50, .46, 0, 1.20, 4.0],
    [ .15, .53, .78, .20, 1, 0.50, 4.6],
    [ .86, .52, .80, .20, 1, 0.60, 4.6],
    [ .32, .505, .88, .14, 1, 0.35, 4.8],
    [ .68, .51, .85, .14, 1, 0.40, 4.8],
    [-.01, .66, .92, .06, 2, 0.70, 4.6],
    [1.01, .64, .95, .06, 2, 0.80, 4.6],
    [ .50, .455, 1.0, 0.00, 3, 0.00, 5.2]      // el girasol grande del centro
];
var NP = 21;                                  // pétalos por capa
var flowers = [];

function initFlowers() {
    flowers = SPECS.map(function (s, i) {
        var rnd = Math.random;
        function jit() { var a = []; for (var k = 0; k < NP; k++) a.push({ a: (rnd() - .5) * .09, l: .92 + rnd() * .16 }); return a; }
        return {
            x: s[0], y: s[1], r: s[2], fog: s[3], z: s[4], d: s[5], dur: s[6],
            ph: rnd() * 6.28, lean: (rnd() - .5) * .9, bo: .02 + rnd() * .03, off: (rnd() - .5) * .04,
            rot: rnd() * 6.28, pj1: jit(), pj2: jit(),
            leaves: [
                { t: .30, side: i % 2 ? 1 : -1, s: .9 + rnd() * .2 },
                { t: .50, side: i % 2 ? -1 : 1, s: 1 + rnd() * .2 },
                { t: .68, side: i % 2 ? 1 : -1, s: .85 + rnd() * .2 }
            ],
            s: {}
        };
    }).sort(function (a, b) { return a.z - b.z; });
}

function bez(s, t) {
    var u = 1 - t;
    return { x: u * u * s.bx + 2 * u * t * s.cx + t * t * s.hx, y: u * u * s.by + 2 * u * t * s.cy + t * t * s.hy };
}

function update(f, now) {
    var s = f.s;
    var secs = (now - T0) / 1000;
    var g = clamp((secs - f.d) / (f.dur * (reduce ? .5 : 1)));
    s.on = g > 0;
    if (!s.on) return;

    s.r = R * f.r;
    var hx0 = f.x * W;
    s.bx = hx0 + f.off * W;
    s.by = gy(s.bx) + H * f.bo;
    var sw = reduce ? 0 : Math.sin(now * .0011 + f.ph) * H * .010 * (.6 + f.r * .5);
    s.hx = hx0 + sw;
    s.hy = f.y * H;
    s.cx = (s.bx + s.hx) / 2 + f.lean * (s.by - s.hy) * .30 + sw * .35;
    s.cy = s.by - (s.by - s.hy) * .55;

    s.sp = 1 - Math.pow(1 - clamp(g / .7), 2);      // el tallo sube primero
    s.bp = clamp((g - .6) / .4);                     // luego la flor se abre

    var n = 34, pts = [];
    for (var i = 0; i <= n; i++) {
        var t = s.sp * i / n, p = bez(s, t);
        pts.push({ x: p.x, y: p.y, t: t });
    }
    s.pts = pts;
    var tip = pts[n];
    s.tx = tip.x; s.ty = tip.y;

    var t2 = s.sp, u = 1 - t2;
    var dx = 2 * u * (s.cx - s.bx) + 2 * t2 * (s.hx - s.cx);
    var dy = 2 * u * (s.cy - s.by) + 2 * t2 * (s.hy - s.cy);
    s.ang = Math.atan2(dx, -dy);
}

function glow(f) {
    var s = f.s;
    if (!s.on || s.bp <= 0) return;
    var a = .30 * s.bp * (1 - f.fog);
    var rad = s.r * (f.z === 3 ? 4.2 : 3.2);
    var gr = ctx.createRadialGradient(s.tx, s.ty, s.r * .6, s.tx, s.ty, rad);
    gr.addColorStop(0, 'rgba(255,196,60,' + a + ')');
    gr.addColorStop(.5, 'rgba(255,150,30,' + (a * .35) + ')');
    gr.addColorStop(1, 'rgba(255,140,20,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(s.tx, s.ty, rad, 0, 7); ctx.fill();
}

function drawLeaf(x, y, side, L, angle, fog, now, phase) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(side, 1);
    ctx.rotate(angle + (reduce ? 0 : Math.sin(now * .0017 + phase) * .05));
    leafPath(ctx, L, L * .30);
    var gr = ctx.createLinearGradient(0, 0, L, 0);
    gr.addColorStop(0, shade('#1c5a22', fog));
    gr.addColorStop(1, shade('#4cae45', fog));
    ctx.fillStyle = gr; ctx.fill();

    ctx.strokeStyle = shade('#a6e08a', fog);
    ctx.globalAlpha = .35;
    ctx.lineWidth = Math.max(1, L * .015);
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(L * .92, 0);
    for (var k = 1; k <= 3; k++) {
        var px = L * .2 * k;
        ctx.moveTo(px, 0); ctx.lineTo(px + L * .14, -L * .13);
        ctx.moveTo(px, 0); ctx.lineTo(px + L * .14,  L * .12);
    }
    ctx.stroke();
    ctx.restore();
}

function drawStem(f) {
    var s = f.s, pts = s.pts, r = s.r;
    var grow = clamp(s.sp * 6);
    var w0 = r * .22 * grow, w1 = r * .15 * grow;
    var left = [], right = [];
    for (var i = 0; i < pts.length; i++) {
        var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
        var dx = b.x - a.x, dy = b.y - a.y, m = Math.hypot(dx, dy) || 1;
        dx /= m; dy /= m;
        var nx = -dy, ny = dx, w = lerp(w0, w1, pts[i].t) / 2;
        left.push([pts[i].x + nx * w, pts[i].y + ny * w]);
        right.push([pts[i].x - nx * w, pts[i].y - ny * w]);
    }
    ctx.beginPath();
    ctx.moveTo(left[0][0], left[0][1]);
    for (i = 1; i < left.length; i++) ctx.lineTo(left[i][0], left[i][1]);
    for (i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
    ctx.closePath();
    ctx.fillStyle = shade('#2b7a2c', f.fog);
    ctx.fill();

    // luz y sombra a los lados del tallo
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    function line(side, color, width, alpha) {
        ctx.beginPath();
        var arr = side < 0 ? left : right;
        ctx.moveTo(arr[0][0], arr[0][1]);
        for (var j = 1; j < arr.length; j++) ctx.lineTo(arr[j][0], arr[j][1]);
        ctx.strokeStyle = color; ctx.lineWidth = width; ctx.globalAlpha = alpha; ctx.stroke();
        ctx.globalAlpha = 1;
    }
    line(-1, shade('#7fd06a', f.fog), Math.max(1, w1 * .28), .55);
    line( 1, shade('#0f3514', f.fog), Math.max(1, w1 * .32), .55);
}

function drawHead(f, now) {
    var s = f.s, sp = spritesFor(f.fog), r = s.r, bp = s.bp;
    var nod = reduce ? 0 : Math.sin(now * .0009 + f.ph * 1.3) * .045;

    ctx.save();
    ctx.translate(s.tx, s.ty);
    ctx.rotate(s.ang * .7 + nod);

    // Botón verde (antes de abrir)
    if (s.sp > .3) {
        var bs = easeOutCubic(clamp((s.sp - .3) / .7));
        var budR = r * .8 * bs * (1 - easeOutCubic(clamp(bp * 1.6)));
        if (budR > 1) {
            var sepal = shade('#2a7a2e', f.fog);
            ctx.fillStyle = sepal;
            for (var k = 0; k < 10; k++) {
                ctx.save();
                ctx.rotate(k * Math.PI * 2 / 10 + .2);
                ctx.rotate(-Math.PI / 2);
                leafPath(ctx, budR * 1.55, budR * .32);
                ctx.fill();
                ctx.restore();
            }
            var gr = ctx.createRadialGradient(-budR * .25, -budR * .3, budR * .1, 0, 0, budR);
            gr.addColorStop(0, shade('#58b04a', f.fog));
            gr.addColorStop(1, shade('#1e5e24', f.fog));
            ctx.fillStyle = gr;
            ctx.beginPath(); ctx.arc(0, 0, budR, 0, 7); ctx.fill();
        }
    }

    if (bp > 0) {
        var i, pb, e, j, wob;
        // Pétalos de atrás
        for (i = 0; i < NP; i++) {
            pb = clamp(bp * 1.6 - (i / NP) * .6);
            if (pb <= 0) continue;
            e = easeOutBack(pb); j = f.pj1[i];
            wob = reduce ? 0 : Math.sin(now * .0021 + i) * .012;
            ctx.save();
            ctx.rotate(i * 2 * Math.PI / NP + f.rot + j.a + wob);
            ctx.translate(0, -r * .72);
            ctx.globalAlpha = clamp(pb * 3);
            drawPetal(sp.pb, r * 1.20 * e * j.l, .55 + .45 * Math.min(e, 1.1));
            ctx.restore();
        }
        // Pétalos de adelante (desfasados, más claros)
        for (i = 0; i < NP; i++) {
            pb = clamp(bp * 1.6 - .15 - (i / NP) * .45);
            if (pb <= 0) continue;
            e = easeOutBack(pb); j = f.pj2[i];
            wob = reduce ? 0 : Math.sin(now * .0019 + i * 1.7) * .012;
            ctx.save();
            ctx.rotate((i + .5) * 2 * Math.PI / NP + f.rot + j.a + wob);
            ctx.translate(0, -r * .72);
            ctx.globalAlpha = clamp(pb * 3);
            drawPetal(sp.pf, r * 1.08 * e * j.l, .55 + .45 * Math.min(e, 1.1));
            ctx.restore();
        }
        // Centro
        var ds = easeOutCubic(clamp((bp - .04) / .5));
        if (ds > 0) {
            var k2 = r * ds / 240;
            ctx.save();
            ctx.rotate(f.rot * 2);
            ctx.drawImage(sp.disc, -256 * k2, -256 * k2, 512 * k2, 512 * k2);
            ctx.restore();
        }
    }
    ctx.restore();
}

function drawFlower(f, now) {
    var s = f.s;
    if (!s.on) return;
    drawStem(f);
    for (var i = 0; i < f.leaves.length; i++) {
        var lf = f.leaves[i];
        if (s.sp <= lf.t) continue;
        var lg = easeOutCubic(clamp((s.sp - lf.t) / .3));
        var p = bez(s, lf.t);
        drawLeaf(p.x, p.y, lf.side, s.r * 1.35 * lf.s * lg, lerp(-.9, .32, lg), f.fog, now, f.ph + lf.t * 5);
    }
    drawHead(f, now);
}

function drawGround(now) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (var x = 0; x < W; x += 12) ctx.lineTo(x, gy(x));
    ctx.lineTo(W, gy(W));
    ctx.lineTo(W, H);
    ctx.closePath();
    var gr = ctx.createLinearGradient(0, GY - H * .02, 0, H);
    gr.addColorStop(0, '#123320'); gr.addColorStop(.35, '#0b2014'); gr.addColorStop(1, '#040b07');
    ctx.fillStyle = gr; ctx.fill();

    for (var i = 0; i < blades.length; i++) {
        var b = blades[i];
        var by = gy(b.x) + 3;
        var sway = reduce ? 0 : Math.sin(now * .0014 + b.ph + b.x * .01) * b.h * .14;
        var tx = b.x + b.lean + sway, ty = by - b.h;
        ctx.fillStyle = b.c;
        ctx.beginPath();
        ctx.moveTo(b.x - b.w, by);
        ctx.quadraticCurveTo(b.x - b.w * .3 + sway * .4, by - b.h * .6, tx, ty);
        ctx.quadraticCurveTo(b.x + b.w * .5 + sway * .4, by - b.h * .5, b.x + b.w, by);
        ctx.fill();
    }
}

function frame(now) {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    var i;
    for (i = 0; i < flowers.length; i++) update(flowers[i], now);

    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < flowers.length; i++) glow(flowers[i]);
    ctx.globalCompositeOperation = 'source-over';

    for (i = 0; i < flowers.length; i++) drawFlower(flowers[i], now);
    drawGround(now);
    requestAnimationFrame(frame);
}

function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(W * .15, H * .105);      // tamaño del girasol grande
    GY = H * .85;                          // altura del suelo
    buildGrass();
}

/* ---------- estrellas ---------- */
function crearEstrellas() {
    var cont = document.getElementById('estrellas');
    for (var i = 0; i < 90; i++) {
        var e = document.createElement('div');
        e.className = 'estrella';
        e.style.left = Math.random() * 100 + '%';
        e.style.top = Math.random() * 100 + '%';
        var sz = Math.random() < .12 ? 4 : 2 + Math.random() * 1.5;
        e.style.width = e.style.height = sz + 'px';
        e.style.animationDelay = Math.random() * 2 + 's';
        cont.appendChild(e);
    }
}

/* ---------- pétalos cayendo ---------- */
function crearPetalos() {
    if (reduce) return;
    setInterval(function () {
        var p = document.createElement('div');
        p.className = 'petalo-caida';
        var w = 9 + Math.random() * 8;
        p.style.width = w + 'px';
        p.style.height = (w * 1.6) + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.setProperty('--dx', ((Math.random() - .5) * 220) + 'px');
        p.style.setProperty('--rot', (360 + Math.random() * 720) + 'deg');
        p.style.animationDuration = (5 + Math.random() * 5) + 's';
        p.style.opacity = .55 + Math.random() * .45;
        document.body.appendChild(p);
        setTimeout(function () { p.remove(); }, 11000);
    }, 300);
}

/* ---------- abrir el regalo ---------- */
window.abrirRegalo = function () {
    var inicio = document.getElementById('inicio');
    inicio.style.opacity = '0';
    inicio.style.pointerEvents = 'none';

    setTimeout(function () {
        inicio.style.display = 'none';
        document.getElementById('escena').classList.add('activa');

        resize();
        initFlowers();
        window.addEventListener('resize', resize);
        crearEstrellas();
        crearPetalos();

        T0 = performance.now();
        running = true;
        requestAnimationFrame(frame);
    }, 1000);
};

})();
</script>
